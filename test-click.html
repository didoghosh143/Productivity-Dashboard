<!DOCTYPE html>
<html>
<head>
    <title>Click Test</title>
    <style>
        .test-card {
            width: 200px;
            height: 150px;
            background: lightblue;
            margin: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .test-card:hover {
            background: lightcoral;
        }
    </style>
</head>
<body>
    <h1>Click Test - Does clicking work?</h1>
    <div class="test-card" onclick="alert('Click works!')">
        Click Me!
    </div>
    
    <script>
        console.log('Test page loaded successfully');
        
        // Test if the actual page elements exist
        setTimeout(() => {
            const elems = document.querySelectorAll('.elem');
            const fullElems = document.querySelectorAll('.fullElem');
            console.log('Found .elem elements:', elems.length);
            console.log('Found .fullElem elements:', fullElems.length);
        }, 1000);
    </script>
</body>
</html>
